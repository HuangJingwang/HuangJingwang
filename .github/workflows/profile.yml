name: Refresh profile
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile.yml'
      - 'README.md'
permissions:
  contents: write
concurrency:
  group: profile-art
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test blog refresh
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh public metrics
        run: python scripts/update_profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Refresh latest three blog posts
        run: python scripts/update_blog.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Pac-Man contribution graphs
        run: |
          npm exec --yes --package=pacman-contribution-graph@5.3.1 -- pacman-contribution-graph --game pacman --platform github --username HuangJingwang --gameTheme github --output assets/pacman-contribution-graph.svg
          npm exec --yes --package=pacman-contribution-graph@5.3.1 -- pacman-contribution-graph --game pacman --platform github --username HuangJingwang --gameTheme github-dark --output assets/pacman-contribution-graph-dark.svg
          python scripts/prepare_pacman.py
      - name: Commit refreshed profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/signal.svg assets/signal-dark.svg assets/pacman-contribution-graph*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile content [skip ci]'
            git push
          fi
