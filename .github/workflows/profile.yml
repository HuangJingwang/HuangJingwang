name: Refresh profile art
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile.yml'
permissions:
  contents: write
concurrency:
  group: profile-art
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public metrics
        run: python scripts/update_profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HuangJingwang
          outputs: |
            assets/snake.svg?color_snake=%237c3aed
            assets/snake-dark.svg?palette=github-dark&color_snake=%2367e8f9
      - name: Commit refreshed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dashboard.svg assets/snake.svg assets/snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile artwork'
            git push
          fi
