<svg xmlns="http://www.w3.org/2000/svg" width="480" height="180" viewBox="0 0 480 180" role="img" aria-label="ChatBot MCP · 给聊天机器人接上工具。">
<title>ChatBot MCP · 给聊天机器人接上工具。</title>
<defs>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".93"/><stop offset=".55" stop-color="#ffffff" stop-opacity=".68"/><stop offset="1" stop-color="#ffffff" stop-opacity=".82"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".85"/><stop offset=".48" stop-color="#ffffff" stop-opacity=".14"/><stop offset="1" stop-color="#ffffff" stop-opacity=".38"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#b0d5ff" stop-opacity=".75"/><stop offset="1" stop-color="#b0d5ff" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#142c50" flood-opacity=".12"/></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<style>.wave{animation:breathe 3.4s ease-in-out infinite alternate}@keyframes breathe{from{transform:scaleY(.5)}to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.wave{animation:none}}</style>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'PingFang SC', sans-serif">
<ellipse cx="403.2" cy="84" rx="120.0" ry="90" fill="url(#halo)" opacity=".6" filter="url(#blur)"/>
<rect x="16" y="12" width="448" height="147" rx="24" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="17" y="13" width="446" height="145" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<text x="36" y="43" fill="#626873" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0">Agents &amp; tools</text>
<text x="36" y="81" fill="#1d1d1f" font-size="26" font-weight="600" text-anchor="start" letter-spacing="-0.7">ChatBot MCP</text>
<text x="36" y="112" fill="#626873" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">给聊天机器人接上工具。</text>
<text x="36" y="136" fill="#626873" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">通过 MCP 连接外部服务与 API。</text>
</g></svg>
